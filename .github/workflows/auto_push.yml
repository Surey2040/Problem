name: Daily Auto Push
on:
  schedule:
    # Runs at 12:00 AM UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  auto-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push code back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Auto Commit Script
        run: python .github/scripts/auto_commit.py
